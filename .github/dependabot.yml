# Version updates. Security updates are enabled in the repository settings and
# need no entry here (#385).
#
# Pull requests target `next`, where all work lands; `main` only moves when a
# release fast-forwards it. Minor and patch updates arrive as one grouped pull
# request a week, so the stream stays reviewable; a major version gets a pull
# request of its own, because a major is the one that needs reading (#307).
#
# A pull request bumping a scoped package gets a title with a bare `@scope` in it,
# which the PR title check rejects: retitle it with the name in backticks before
# merging, or the release notes mention a stranger (#399).
#
# `increase-if-necessary` on npm: a range that already admits the new version is
# left as it is, and only the lockfile moves, which is what CI tests against. The
# default raised every range naming the bumped package, peer ranges included, so a
# Vue patch became every consumer's new Vue floor, unasked (#953, #1376, #1377).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: next
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors that cannot land, so their pull requests only ever get closed. One entry
    # covers the whole workspace, so a version range would also stop the book already
    # on the next major; skipping majors leaves each book its own minors and patches.
    ignore:
      # `examples/sveltekit` is the Kit 2 book and `examples/sveltekit3` the Kit 3 one
      # (#1200, #1205): a major is never right for both, and the adapter follows Kit.
      - dependency-name: '@sveltejs/kit'
        update-types: [version-update:semver-major]
      - dependency-name: '@sveltejs/adapter-auto'
        update-types: [version-update:semver-major]
      # `@poveste/plugin-nuxt` builds an h3 app for Nuxt's Nitro, which runs h3 1:
      # h3 2 drops `App` and `createApp`, so it waits for Nuxt.
      - dependency-name: h3
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
