name: Test example
description: Build the poveste monorepo and run an example's Playwright suite

inputs:
  dir:
    description: Path to the example (e.g. ./examples/vue3)
    required: true

runs:
  using: composite
  steps:
    - name: Resolve example name
      id: example
      shell: bash
      run: echo "name=$(basename '${{ inputs.dir }}')" >> "$GITHUB_OUTPUT"

    - uses: pnpm/action-setup@v4.0.0

    - uses: actions/setup-node@v4
      with:
        node-version: 26
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install

    - name: Resolve Playwright version
      id: playwright
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: |
        version="$(pnpm exec playwright --version | sed 's/Version //')"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: pnpm exec playwright install chromium

    # Gated with the browser install, not run every job: `install-deps` shells
    # out to apt, which blocks indefinitely on a lock or a slow mirror. It hung
    # 15 minutes here with no output while every later step waited. The runner
    # image already ships Playwright's system libraries, so this only matters
    # when browsers are actually being fetched.
    - name: Install Playwright system deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.dir }}
      # Best-effort. `install-deps` shells out to apt, which blocks on a lock
      # or a slow mirror; it hung 15 minutes with no output before this was
      # bounded. The runner image already ships Playwright's libraries — every
      # job that skips this step passes — so a failure here must not fail the
      # build. A genuinely missing library still surfaces, loudly, at launch.
      # `timeout` the command, not the step: composite actions reject
      # `timeout-minutes` and the template fails to load.
      run: timeout 300 pnpm exec playwright install-deps chromium || echo 'install-deps skipped'

    - name: Build
      shell: bash
      run: pnpm run build

    - name: Build book
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: pnpm run story:build

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: pnpm run test

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report-${{ steps.example.outputs.name }}
        path: ${{ inputs.dir }}/playwright-report
