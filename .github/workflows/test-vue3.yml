name: Vue 3 tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A wedged job otherwise burns GitHub\'s 360-minute default in silence.
    timeout-minutes: 15
    name: Vue 3 example
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-example
        with:
          dir: ./examples/vue3
