name: Check PR title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

# The action reads the PR via the API — without this it fails with
# "Resource not accessible by integration".
permissions:
  pull-requests: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      # Please look up the latest version from
      # https://github.com/amannn/action-semantic-pull-request/releases
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
