name: Audit shipped dependencies

# A new advisory arrives without a commit, so a check that only runs on pushes
# learns about it at the next release, when it blocks the cut. The scheduled run
# is what makes it fail somewhere first. Only a high or critical advisory on a
# package a published package installs counts — see scripts/checks/audit.ts.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - pnpm-lock.yaml
      - scripts/checks/audit.ts
      - scripts/checks/audit.spec.ts
      - .github/workflows/audit.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    name: Audit shipped dependencies
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: No high or critical advisory reaches a consumer
        run: pnpm run test:audit
