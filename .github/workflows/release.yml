name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.0.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Gate the publish: pack the tarballs, install them into a clean project
      # with npm, and run a real `poveste build`. Catches "works in the pnpm
      # workspace, broken for consumers" bugs before they ship.
      - name: Smoke test (pack + install + build)
        run: pnpm run test:smoke

      - name: Create GitHub release
        run: npx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tokenless publish via npm Trusted Publishing (OIDC) — needs `id-token: write`
      # above and a Trusted Publisher configured per package on npmjs.com (which
      # requires each package to have been published once already).
      - name: Publish to npm
        run: pnpm -r publish --provenance --access public --no-git-checks
