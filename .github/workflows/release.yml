name: Release

permissions:
  contents: write
  id-token: write
  # Reading the tagged commit's workflow runs (#192). An explicit block sets
  # every scope it omits to `none`, so this has to be named.
  actions: read

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version bump is pushed straight to `main` and bypasses branch
      # protection, so it is the one published commit no gate ever cleared.
      # The push does start the test workflows; this waits for them (#192).
      - name: Require the tagged commit to be green
        run: bash .github/scripts/await-commit-checks.sh "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4.0.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Gate the publish: pack the tarballs, install them into a clean project
      # with npm, and run a real `poveste build`. Catches "works in the pnpm
      # workspace, broken for consumers" bugs before they ship.
      - name: Smoke test (pack + install + build)
        run: pnpm run test:smoke

      # A partial publish cannot be walked back — the tag, the GitHub release and
      # half the registry would all refer to it (#286, #302). The offline checks
      # already ran on the PR; only the registry lookup is release-only.
      - name: Preflight — every package is bootstrappable, installable and resolvable
        run: pnpm run test:publishable

      # The release body is the hand-written CHANGELOG section, because publishing
      # the release is what emails every watcher — and editing it afterwards never
      # re-notifies, so a generated commit list was the only thing subscribers ever
      # saw (#399). Extracted before anything publishes: a missing section stops the
      # release here rather than shipping a release with no body.
      - name: Build the release notes
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-changelog.ts "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # Drafted, not published: publishing is what emails every watcher, and the
      # body now tells them what to upgrade — so it must not go out before npm has
      # the packages it describes. The draft is published further down, once the
      # registry has been verified.
      #
      # `create` fails when a release already exists, which is exactly what a
      # re-run of this job hits — the documented recovery for a failed publish. So
      # an existing release is edited instead, or a re-run would leave the old body
      # published and still go green.
      - name: Draft the GitHub release
        run: |
          cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/body.md"
          # The generated commit list is still the accurate record of what landed,
          # so it goes underneath — best-effort, since it is not the part that has
          # to explain the release.
          if npx changelogithub --output "$RUNNER_TEMP/generated.md"; then
            printf '\n---\n\n' >> "$RUNNER_TEMP/body.md"
            cat "$RUNNER_TEMP/generated.md" >> "$RUNNER_TEMP/body.md"
          fi
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/body.md" \
              "${prerelease[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/body.md" \
              "${prerelease[@]}"
          fi
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tokenless publish via npm Trusted Publishing (OIDC) — needs `id-token: write`
      # above and a Trusted Publisher configured per package on npmjs.com (which
      # requires each package to have been published once already).
      #
      # `--tag` is not optional here. npm defaults every publish to `latest`
      # whatever the semver says, so a prerelease would move it on all twelve
      # packages and hand a beta to every `npm i poveste` and every StackBlitz
      # starter, which resolve the tag (#553). The same `*-*` test marks the
      # GitHub release prerelease a few steps above.
      - name: Publish to npm
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "Publishing to the '$tag' dist-tag"
          pnpm -r publish --provenance --access public --no-git-checks --tag "$tag"

      # `pnpm -r publish` logged "✅ Published" for a package the registry never
      # recorded, and the run went green — v0.7.0 shipped without
      # @poveste/plugin-vue (#327). Everything above this line inspects tarballs
      # we are about to send; this asks npm what arrived.
      #
      # These three run even after one of them fails, so a single run names every
      # problem: a partial publish and a missing GitHub release would otherwise
      # take two cycles to discover, one per re-run.
      - name: Verify every package reached npm
        if: ${{ !cancelled() }}
        run: pnpm run test:published

      # The only check that installs the published set the way a user does, so
      # it is meaningless before the publish and meaningful right after. On a
      # cron it was up to 17.7h behind a broken release (#298).
      - name: Verify the published set installs
        if: ${{ !cancelled() }}
        run: pnpm run test:starters:release

      # Publishing the draft is what sends the release notification, so it waits
      # until the packages the notes point at are on npm and installable. A step
      # with no `if` runs only when every step before it succeeded, which is the
      # condition wanted here: a failed registry check must not mail anyone.
      - name: Publish the GitHub release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Both release steps stay non-fatal so a GitHub API blip cannot block an
      # otherwise good publish — but the run must not go green without the
      # release that explains it. Last, so it reports rather than gates (#186).
      - name: Verify the GitHub release was created
        if: ${{ !cancelled() }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --json tagName --jq .tagName; then
            echo "::error::Published $GITHUB_REF_NAME to npm, but no GitHub release exists for it."
            echo "Creating it failed earlier in this run. Create it now — the packages are already out:"
            echo "  node scripts/check-changelog.ts $GITHUB_REF_NAME > notes.md"
            echo "  gh release create $GITHUB_REF_NAME --title $GITHUB_REF_NAME --notes-file notes.md"
            exit 1
          fi
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true" ]; then
            echo "::error::$GITHUB_REF_NAME is still a draft, so nobody watching the repo was notified."
            echo "The draft is published only once the packages are verified on npm. Fix what failed above, then:"
            echo "  gh release edit $GITHUB_REF_NAME --draft=false"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
