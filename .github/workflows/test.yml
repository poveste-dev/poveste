name: Continuous tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A wedged job otherwise burns GitHub\'s 360-minute default in silence.
    timeout-minutes: 15
    name: Unit tests and smoke
    steps:
      - uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: pnpm-v1-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      # Cheap and needs nothing built, so it runs before the build rather than
      # next to the smoke test.
      - name: Check the version tables
        run: pnpm run test:versions

      - name: Check the npm package pages
        run: pnpm run test:readmes

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Smoke test (pack + install + build)
        run: pnpm run test:smoke
