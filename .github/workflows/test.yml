name: Continuous tests

on:
  # `next` as well as `main`. Staged work parks on `next` and lands there by
  # rebase, so a push produces a tree no run has ever seen — individually tested
  # commits, jointly unverified (#396).
  #
  # It also gives PRs targeting `next` something to restore from. Cache reads are
  # scoped to the run's own ref plus the default branch, so without a run on
  # `next` they fall back to `main`, and the moment the two lockfiles diverge
  # every such PR saves its own full copy instead (#417).
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only a PR's own runs supersede each other. A push must always finish: a
  # cancelled job never runs `actions/cache`'s post step, so it saves nothing —
  # and on `next`, where work lands by rebase, a burst of force-pushes would
  # otherwise leave the branch with neither a cache nor a result.
  #
  # The same reason the release commit ends up with no result on `main` (#335).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which of the expensive jobs below this push actually needs.
  #
  # Filtering has to happen HERE, per job, and never with `paths:` on the
  # workflow. `main` requires 8 checks and 7 of them live in this file and
  # test-examples.yml; a workflow filtered out by `paths:` never runs, so its
  # checks are never *created* and sit pending forever — a PR requiring them can
  # never merge. A job skipped by `if:` is created, reports skipped, and
  # satisfies the requirement. `starters.yml` filters at the workflow level and
  # is right to: it carries no required check (#334).
  #
  # `git diff` rather than a paths-filter action. This is the workflow that gates
  # every merge, and a third-party action here would be one more thing to keep
  # off a stale major (#308) and to answer for on an advisory (#455), to save
  # about ten lines of shell.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Changed paths
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request this checks out the merge commit, whose first
          # parent is the base branch tip — which is what makes the diff below a
          # single command. Two commits deep is the least that has a parent.
          fetch-depth: 2

      - name: Work out what changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Only a pull request has a base to compare against. A push to `main`
          # or `next` is a tree no run has seen (#396) and a dispatch was asked
          # for, so both run everything.
          if [ "$EVENT_NAME" != 'pull_request' ]; then
            everything=true
          elif ! changed=$(git diff --name-only HEAD^1 HEAD 2>/dev/null) || [ -z "$changed" ]; then
            # A diff that cannot be computed must never quietly skip a suite, so
            # the fallback is to run more rather than less.
            echo "::warning::could not work out what changed — running every job"
            everything=true
          else
            everything=false
            echo "Changed files:"
            printf '%s\n' "$changed" | sed 's/^/  /'
          fi

          # A skip-list, not a match-list. Both jobs below used to gate on an
          # enumeration of what could affect them, and an enumeration is wrong
          # silently in the direction that matters: a path nobody thought of is
          # skipped without a word. Inverting it means an unclassified path runs
          # the jobs, and being wrong here costs one CI run rather than the
          # Node 24 builtin against a 22.22.2 floor that #608 nearly shipped.
          #
          # So this lists only what provably cannot change a build or a test
          # result: prose, and the instructions agents read. Nothing here is
          # imported by a package, read by a unit test, or packed into a
          # tarball. Add a line only after checking that (#620).
          INERT='^(docs/|ai/|\.claude/|\.codex/|\.cursor/|\.github/(ISSUE_TEMPLATE/|DISCUSSION_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md$|commit-convention\.md$)|[^/]+\.md$|LICENSE$|netlify\.toml$)'
          # `docs` is a workspace package, so `docs/package.json` is a manifest
          # `pnpm install` resolves — prose by path and not by content. No
          # manifest is inert, wherever it sits.
          MANIFEST='(^|/)package\.json$'

          if [ "$everything" = true ]; then
            code=true
          else
            # grep exits 1 for "selected nothing" and 2 for a bad pattern. Only
            # the first means everything was inert; treating them alike would
            # skip every job on a typo in the line above, which is the whole
            # failure this gate was rewritten to stop. `|| status=$?` keeps the
            # non-match case from tripping `set -e`.
            unclassified=0
            forced=$(printf '%s\n' "$changed" | grep -vE "$INERT") || unclassified=$?
            manifests=0
            changed_manifests=$(printf '%s\n' "$changed" | grep -E "$MANIFEST") || manifests=$?

            if [ "$unclassified" -gt 1 ] || [ "$manifests" -gt 1 ]; then
              echo "::warning::could not classify the changed paths — running every job"
              code=true
            else
              runs=$(printf '%s\n%s\n' "$forced" "$changed_manifests" | sed '/^$/d' | sort -u)
              if [ -n "$runs" ]; then
                code=true
                echo "Not inert, so the gated jobs run:"
                printf '%s\n' "$runs" | sed 's/^/  /'
              else
                code=false
                echo "Every changed path is prose or agent config — gated jobs skipped."
              fi
            fi
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code: $code"

  build-and-test:
    runs-on: ubuntu-latest
    # A wedged job otherwise burns GitHub\'s 360-minute default in silence.
    timeout-minutes: 15
    name: Unit tests and smoke
    steps:
      - uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm modules
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: pnpm-v1-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      # Cheap and needs nothing built, so it runs before the build rather than
      # next to the smoke test.
      - name: Check the version tables
        run: pnpm run test:versions

      # Cheap and manifest-only, so it sits with the other front-of-queue checks
      # rather than after the build.
      - name: Check CI reads .node-version
        run: pnpm run test:node-versions

      - name: Check every published package declares a test script
        run: pnpm run test:package-tests

      - name: Check the npm package pages
        run: pnpm run test:readmes

      # On the PR that adds a config key, not at release time: a gate that only
      # runs in `release:check` blocks the release on a docs task instead of the
      # change that introduced it (#152).
      - name: Check the config reference
        run: pnpm run test:config-reference

      # The example harness is three lists that have to agree, and nothing compared
      # them until a job died on its own unknown-name guard before running a test
      # (#384). Cheap and needs nothing built.
      - name: Check the example harness wiring
        run: pnpm run test:example-wiring

      - name: Check mirrored conformance sets
        run: pnpm run test:mirrors

      # The other half of the contract: a book can carry every shared story and
      # still fail 18 specs on a preset it did not declare (#540).
      - name: Check the conformance config
        run: pnpm run test:conformance-config

      # Four hand-found instances of one rule (#328, #595, #596, #600), none of
      # which failed a test. Parses the templates rather than grepping them,
      # because the shape does not decide it — two legitimate groups put the
      # preview in more than one branch, and the condition is what separates
      # them (#607).
      - name: Check no layout choice moves the preview
        run: pnpm run test:preview-position

      # A published recipe and the example that guards it are one thing; the
      # example is a copy, and a copy drifts (#436).
      - name: Check the published recipes
        run: pnpm run test:recipes

      - name: Test the release scripts
        run: pnpm run test:scripts

      # The docs site is not part of the package build, so it gets its own. Both
      # defects this covers answered HTTP 200 while broken (#288, #343), which is
      # why the check reads the build instead of probing it.
      - name: Build the docs site
        run: pnpm run docs:build

      - name: Check the docs site
        run: pnpm run test:docs-site

      - name: Build
        run: pnpm run build

      # Reports, never fails on the number — see the header of the script for
      # why a threshold here would be red on the day it landed. It needs the
      # emitted declarations, so it cannot move up beside the manifest checks.
      - name: Report documented-export coverage
        run: pnpm run test:doc-coverage

      # After `build`, not beside `lint`: @poveste/app imports @poveste/shared
      # and @poveste/controls, which are not in its tsconfig `paths` and resolve
      # through the workspace symlink to `dist/*.d.ts`. Run cold, every named
      # import in the package fails to resolve and it reports hundreds of
      # errors that say nothing about the source (#441).
      - name: Type-check the app
        run: pnpm --filter @poveste/app run typecheck

      # The offline half of the release preflight. Here too, not just at release:
      # there the same failure lands after the bump is already on `main` (#302).
      - name: Check the published package surface
        run: pnpm run test:packaging

      - name: Run tests
        run: pnpm run test

      - name: Smoke test (pack + install + build)
        run: pnpm run test:smoke

  # Story collection is the code that breaks on Windows — `storyMatch` /
  # `storyIgnored` globs, the vite-node module graph, path handling throughout
  # `packages/poveste/src/node/` — and until something runs there upstream's
  # Windows collection bug (histoire#463) cannot be reproduced or declined
  # (#156). A dedicated job rather than a matrix on the one above, so the
  # required `Unit tests and smoke` check keeps its name. Unit tests plus a real
  # book build cover the class of path bug; the Playwright example suites, which
  # are costly and already flaky under parallelism (#75), stay Linux-only.
  collection-windows:
    needs: changes
    # Against `false` rather than `true`, matching test-examples.yml: an output
    # that was never written must mean run, never skip.
    if: needs.changes.outputs.code != 'false'
    runs-on: windows-latest
    timeout-minutes: 20
    name: Collection (windows)
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      # The real Windows exercise: collect and build a book end to end. vue3 is
      # the plainest collector path, no Nuxt app boot in the way of the globbing
      # and path handling this is here to prove.
      - name: Build a book
        run: pnpm --filter ./examples/vue3 run story:build

  # The floor is a claim about the published tarballs, so it is proven the way a
  # consumer meets it: build on the release toolchain, then install and build a
  # real book on the minimum the manifests declare. Without this the floor is a
  # sentence — `>=26` was asserted for exactly that reason and was never real (#303).
  minimum-node:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Node floor
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - name: Install node (release toolchain)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      # The lowest version `engines.node` admits. Bump both together.
      - name: Switch to the declared minimum
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - name: Smoke test on the minimum (pack + install + build)
        run: |
          node --version
          pnpm run test:smoke
