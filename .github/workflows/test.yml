name: Continuous tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A wedged job otherwise burns GitHub\'s 360-minute default in silence.
    timeout-minutes: 15
    name: Unit tests and smoke
    steps:
      - uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: pnpm-v1-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      # Cheap and needs nothing built, so it runs before the build rather than
      # next to the smoke test.
      - name: Check the version tables
        run: pnpm run test:versions

      - name: Check the npm package pages
        run: pnpm run test:readmes

      - name: Test the release scripts
        run: pnpm run test:scripts

      - name: Build
        run: pnpm run build

      # The offline half of the release preflight. Here too, not just at release:
      # there the same failure lands after the bump is already on `main` (#302).
      - name: Check the published package surface
        run: pnpm run test:packaging

      - name: Run tests
        run: pnpm run test

      - name: Smoke test (pack + install + build)
        run: pnpm run test:smoke

  # Story collection is the code that breaks on Windows — `storyMatch` /
  # `storyIgnored` globs, the vite-node module graph, path handling throughout
  # `packages/poveste/src/node/` — and until something runs there upstream's
  # Windows collection bug (histoire#463) cannot be reproduced or declined
  # (#156). A dedicated job rather than a matrix on the one above, so the
  # required `Unit tests and smoke` check keeps its name. Unit tests plus a real
  # book build cover the class of path bug; the Playwright example suites, which
  # are costly and already flaky under parallelism (#75), stay Linux-only.
  collection-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    name: Collection (windows)
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      # The real Windows exercise: collect and build a book end to end. vue3 is
      # the plainest collector path, no Nuxt app boot in the way of the globbing
      # and path handling this is here to prove.
      - name: Build a book
        run: pnpm --filter ./examples/vue3 run story:build
