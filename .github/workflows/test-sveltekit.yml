name: SvelteKit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A wedged job otherwise burns GitHub\'s 360-minute default in silence.
    timeout-minutes: 15
    name: SvelteKit example
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-example
        with:
          dir: ./examples/sveltekit

      # svelte-check on the Kit app itself, which is a separate concern from the
      # poveste e2e above. It runs after the action rather than before because
      # it needs the install the action already did.
      - name: Check example
        working-directory: ./examples/sveltekit
        run: pnpm run sk:check
