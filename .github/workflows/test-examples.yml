name: Example tests

on:
  # `next` as well as `main` — staged work lands there by rebase, so a push is a
  # tree no run has seen (#396), and a run on `next` is what PRs targeting it
  # restore their cache from (#417). Same reasoning as `test.yml`.
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Pushes always finish — a cancelled job skips `actions/cache`'s post step and
  # saves nothing. Same reasoning as `test.yml` (#335).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Built once and handed to every example, so all of them are tested against
  # the same bytes. Five jobs each running their own `pnpm run build` would also
  # work, but then "it fails only on svelte5" has one more explanation in it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: packages-dist
          path: packages/*/dist
          retention-days: 1
          # The examples resolve these through workspace symlinks, so a missing
          # one would surface as a confusing module-not-found in every matrix
          # job rather than here.
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    # A wedged job otherwise burns GitHub's 360-minute default in silence.
    timeout-minutes: 20
    needs: build
    # One job per example, so a red check names the framework on its own. The
    # shared `e2e/` suite runs in every one of them against that framework's
    # book — the whole point of a conformance suite is that a chrome regression
    # which only shows up under one plugin cannot hide behind the others.
    #
    # `fail-fast: false` because "svelte5 broke" and "svelte5 and nuxt4 broke"
    # are different bugs, and cancelling the rest hides which one it is.
    strategy:
      fail-fast: false
      matrix:
        example: [vue3, nuxt4, svelte5, sveltekit, vue3-tailwind, vike, quasar]
    name: Example e2e (${{ matrix.example }})
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - uses: actions/download-artifact@v4
        with:
          name: packages-dist
          path: packages

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      # Best-effort: `install-deps` shells out to apt, which blocks on a lock or
      # a slow mirror. The runner image already ships Playwright's libraries —
      # every job that skipped this step passed — so it must not fail the build.
      # A genuinely missing library still surfaces, loudly, at browser launch.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 300 pnpm exec playwright install-deps chromium || echo 'install-deps skipped'

      # Lives here rather than in the nuxt4 example's own suite because
      # plugin-nuxt has no test infrastructure, and this is the only job that
      # builds a Nuxt book (#223).
      - name: Assert the host .nuxt is untouched by a story build
        if: matrix.example == 'nuxt4'
        working-directory: ./examples/nuxt4
        run: pnpm run test:build-dir

      # The other half of the vike example's contract. `vite.config.ts` drops
      # `vike()` when POVESTE is set, and only the book side of that condition is
      # covered by the e2e run below — break it in the app direction and the book
      # still builds. Without `vike()` there is no `index.html` for Vite to enter
      # from, so this step fails loudly (#369).
      - name: Assert the Vike app still builds with vike() loaded
        if: matrix.example == 'vike'
        run: pnpm --filter ./examples/vike run vike:build

      # Two books, two different regressions, and each passes while the other's
      # defect is live.
      #
      # Vike installs its own `unhandledRejection` listener, removing the default
      # that used to be the only thing terminating a failed build (#405). It has one
      # story, so nothing is ever in flight to strand.
      #
      # vue3 has 57, so a failure abandons executions mid-run — and collection ports
      # that are not closed then keep the process alive with nothing left to do
      # (#426). Measured: with the leak restored, vue3 hangs here and vike does not.
      - name: Assert a broken component fails the book build
        if: matrix.example == 'vike' || matrix.example == 'vue3'
        working-directory: ./examples/${{ matrix.example }}
        env:
          COMPONENT: ${{ matrix.example == 'vike' && 'src/Button.vue' || 'src/components/InjectDemo.vue' }}
          # Skips the forced exit in bin.ts, so a build that leaks hangs again and
          # `timeout` can see it. With the forced exit, a leak is indistinguishable
          # from a clean failure and this guard covers nothing (#433).
          POVESTE_NO_FORCE_EXIT: '1'
        run: |
          cp "$COMPONENT" "$RUNNER_TEMP/component.bak"
          printf '<script setup lang="ts">\ndefineProps<{ label: string }>(\n</script>\n' > "$COMPONENT"
          set +e
          timeout 90 pnpm run story:build > "$RUNNER_TEMP/broken-build.log" 2>&1
          code=$?
          set -e
          cp "$RUNNER_TEMP/component.bak" "$COMPONENT"
          if [ "$code" -eq 124 ]; then
            echo "::error::a failed build never ended — something is still holding the event loop open (#426, #434)"
            grep -a POVESTE_ACTIVE_HANDLES "$RUNNER_TEMP/broken-build.log" | tail -1
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "::error::poveste build reported success for a broken component (#405)"
            tail -20 "$RUNNER_TEMP/broken-build.log"
            exit 1
          fi
          echo "A broken component exits $code and the process ends on its own"

      - name: Build book
        run: pnpm --filter ./examples/${{ matrix.example }} run story:build

      # `POVESTE_E2E_EXAMPLE` narrows both the projects and the servers the root
      # config starts, so this job boots one preview server rather than five.
      # See the config for why that is not just `--project`.
      - name: Run tests
        env:
          POVESTE_E2E_EXAMPLE: ${{ matrix.example }}
        run: pnpm run test:e2e

      # Retries make a flake green, so this is the only thing that says one
      # happened. A warning, never a failure: a flake is worth reading, not
      # worth blocking a merge on (#75).
      - name: Flag flaky tests
        if: ${{ !cancelled() }}
        run: node .github/scripts/annotate-flaky.mjs playwright-results.json ${{ matrix.example }}

      # `test-results`, not `playwright-report`: the reporters are `list` and
      # `json`, so no report directory is ever written, and `trace:
      # on-first-retry` puts the traces here. Pointed at the wrong path this
      # silently uploaded nothing.
      #
      # Not `if: failure()`. A flaky test passes on retry, so the job succeeds
      # and that gate skips the upload — discarding the trace in the one case
      # nobody can reproduce on demand (#75). `test-results` is empty unless
      # something retried, hence `ignore` rather than `error`.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces-${{ matrix.example }}
          path: |
            test-results
            playwright-results.json
          if-no-files-found: ignore
          retention-days: 7
