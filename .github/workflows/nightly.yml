name: Publish Nightlies
# Disabled until continuous releases are set up for poveste (see #8).
# `pkg-pr-new publish` needs the pkg.pr.new GitHub App installed on the repo.
# Re-enable the push/pull_request triggers once that's configured.
on:
  workflow_dispatch:

# Only `contents: read`, like the other build workflows — but this one is not
# purely build-and-test: `pkg-pr-new publish` runs at the end. The workflow is
# disabled until the pkg.pr.new App is installed, so that step has never run and
# the scope it needs cannot be verified from here. An explicit block sets every
# scope it omits to `none` (#192), so whoever re-enables it will find out at that
# step, loudly, rather than later and quietly.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "pnpm_cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm modules
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
            ~/.cache/Cypress
          key: pnpm-v1-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-v1-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - run: pnpx pkg-pr-new publish './packages/*'
