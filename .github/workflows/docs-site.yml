name: Check the deployed docs site

# The contract `test:docs-site` holds the build to, asked of production instead.
#
# It was left for someone to run after a deploy, and nobody did: #840's redirects
# shipped in 0.15.0 and the site was still serving the 0.14.0 deploy a day later,
# with every `.html` twin answering 200 — the state #811 was closed for fixing
# (#911).
#
# Scheduled rather than tied to the release, because a deploy can fail or be
# skipped at any time, not only at a cut, and the site is what readers have in
# between. Not on pull requests: this asks production, which a pull request
# cannot change — the site deploys from `main` (#321) — so a red run there is a
# true report aimed at the wrong person. The build-side half of the same contract
# runs on every PR as `test:docs-site`, and a redirect change is proved against
# its deploy preview with `POVESTE_DOCS_SITE`.
#
# **This file targets `main`, not `next`, and that is the whole point.** GitHub
# runs a scheduled workflow from the default branch only. Merged to `next` it
# did not run at all until the next cut moved `main` — a daily check that starts
# working weeks after it is written, during exactly the window it exists for.
# Landed on `main` it ran the next morning. The same exception #938 took, for the
# same reason: the docs site is a `main` artifact and cannot be watched from the
# integration branch.
#
# There is one copy, not two. `next` is rebased onto `main` rather than merged,
# so it carries this file rather than a version of it, and nothing here can
# disagree with what is scheduled.
#
# `workflow_dispatch` stays, for asking production straight after a deploy rather
# than waiting for 08:00 — `gh workflow run "Check the deployed docs site"`.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Per trigger, and cancelling neither. Both triggers here run on `main`, so one
# group would hold the cron and a dispatch together — and dispatching straight
# after a deploy, which is what `workflow_dispatch` is for, would then cancel the
# 08:00 run. A cancelled run reports no check runs at all, so the day's answer
# would go missing rather than come back red: the silence this file exists to
# break. Two read-only runs overlapping cost nothing worth avoiding.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    name: Check the deployed docs site
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: poveste.dev answers a crawler correctly
        run: pnpm run test:docs-site:live
