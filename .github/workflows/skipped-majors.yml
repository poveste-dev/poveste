name: Watch skipped majors

# Dependabot opens no pull request for a major it's told to skip, so without this
# nothing says when one is released. See scripts/checks/skipped-majors.ts and #1469.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/checks/skipped-majors.ts
      - scripts/checks/skipped-majors.spec.ts
      - .github/workflows/skipped-majors.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skipped-majors:
    runs-on: ubuntu-latest
    name: Watch skipped majors
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: No skipped major is out past the newest book
        run: pnpm run test:skipped-majors
