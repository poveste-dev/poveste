name: Check StackBlitz starters

# The "Try it live" starters install with npm from the public registry, so the
# workspace suites cannot vouch for them — see the header of
# scripts/checks/starters.ts. The failure mode is the registry moving underneath
# a file nobody touched, which is why this is mostly a scheduled run; the paths
# filter just catches a bad edit before it ships.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - docs/.vitepress/theme/starters.ts
      - scripts/checks/starters.ts
      - scripts/checks/starters.spec.ts
      - vitest.config.mts
      - .github/workflows/starters.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  starters:
    runs-on: ubuntu-latest
    name: Resolve starters against npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # The check is a vitest test now, so it needs the workspace installed.
      # Running `scripts/checks/starters.ts` with node imports it and exits 0.
      - name: Install dependencies
        run: pnpm install

      - name: Resolve every starter
        run: pnpm run test:starters
