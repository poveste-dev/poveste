name: Svelte 5 tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A wedged job otherwise burns GitHub\'s 360-minute default in silence.
    timeout-minutes: 15
    name: Svelte 5 example
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test-example
        with:
          dir: ./examples/svelte5

      # svelte-check over the stories, which is where the public `Hst` surface —
      # typed props, `initState`, the `children`/`controls` snippets — is
      # exercised most. It runs after the action because it needs both the
      # install and the `pnpm run build` that produces the plugin's types.
      - name: Check example
        working-directory: ./examples/svelte5
        run: pnpm run check
