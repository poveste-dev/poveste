# Every pnpm setting belongs in this file, including the ones `.npmrc` used to
# hold. pnpm 11 reads none of them from there: `shamefully-hoist=true` in a root
# `.npmrc` leaves this workspace's root `node_modules` at its 21 declared
# devDependencies, while `shamefullyHoist: true` here takes it to 1003 (#665).
# npm still reads that file and warns about the pnpm keys in it, which by then
# was the only effect they had.
packages:
  - 'packages/*'
  - 'examples/*'
  - docs
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  puppeteer: true
  svelte-preprocess: true
  # The root `prepare` script installs the hook; the package's own postinstall
  # would do it again on every dependency install.
  simple-git-hooks: false
catalog:
  '@types/node': ^22.10.1
  '@vueuse/core': ^15.0.0
  '@tailwindcss/postcss': ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  postcss: ^8.5.23
  tailwindcss: ^4.3.3
  typescript: 6.0.3
  vue-tsc: ^3.3.11
  vite: ^8.3.0
  vitest: ^5.0.1

peerDependencyRules:
  ignoreMissing:
    - '@algolia/client-search'
    - '@types/react'
    - eslint
    - react
    - react-dom
    - vue
    - webpack
  allowedVersions:
    eslint: '*'
    eslint-plugin-promise: '*'
    eslint-plugin-vue: '*'
    vue: '*'

# `@poveste/plugin-svelte` declares SvelteKit only as an optional peer and never
# imports it, but pnpm's `auto-install-peers` resolves that range anyway and
# recorded 2.55.0 in the lockfile. The advisories are matched against the
# lockfile, so a second copy there keeps six of them open however new the
# examples are (#495).
#
# An override rather than raising the peer floor: `^2.53.0` is a published
# compatibility claim, and nothing in the plugin needs 2.70 — narrowing it would
# tell every user on 2.53–2.69 they are unsupported to fix a lockfile entry.
overrides:
  '@sveltejs/kit': ^2.70.2
  # Group A of #455 — advisories that reach a consumer through a published
  # package's `dependencies`. All transitive, so there is no manifest to bump,
  # and every parent range already admits the fixed version; these pin the floor
  # so a fresh resolution cannot drift back under it.
  #
  # Caret rather than `>=`: an unbounded floor resolved `basic-ftp` to 6.2.1 and
  # `js-yaml` to 5.4.1, a major bump wearing a security fix's clothes.
  #
  # `extract-zip` is absent on purpose: it has no patched version and no parent
  # bump escapes it (#569). It arrives under `capture-website`, whose own latest
  # still caps puppeteer at 24, and `@puppeteer/browsers` only dropped the
  # dependency at 3.0.0, which puppeteer 25 is the first to pull.
  # `nanoid@3` reaches a consumer through Vue's own `@vue/compiler-sfc` and
  # through `unhead`, both by way of `postcss`. Invisible until #347 made
  # `@poveste/vendors`' seven libraries ordinary dependencies; the prebundle hid
  # the graph rather than the risk.
  nanoid@^3: ^3.3.18
  js-yaml@^3: ^3.15.1
  js-yaml@^4: ^4.3.1
  basic-ftp: ^5.3.1
  ip-address: ^10.3.1
  # `picomatch@2` is what `@rollup/pluginutils@4.2.1` filters through, and that
  # is the filter `rollup-plugin-typescript2` asks whether to emit a declaration
  # for. Under 2.3.2 it answered no for every file, so `dist/client` came out
  # with no `.d.ts` at all and the vendors export map was written from an empty
  # glob (#560) — which is why this bump waited for the guard in #566 to make
  # that state fail rather than commit. `picomatch@4` is unaffected and separate.
  picomatch@^2: ^2.3.2
  '@humanfs/node': ^0.16.8
  '@vueuse/core': ^15.0.0
  '@vueuse/shared': ^15.0.0
  '@floating-ui/vue': ^2.0.1

# The checks that run before the build, declared as a task graph so one run
# reports every failure instead of stopping at the first (#716).
#
# The `&&` chain in `release:check` is still the gate that decides. This is a
# report: additive, and revertible by deleting this block and one script.
#
# `cache: false` on every task is deliberate. Task result caching is step two of
# #716 and lands behind a measurement, because a wrong cache key ships a stale
# result and a green run is exactly what that looks like.
tasks:
  test:checks:
    cache: false

# `release:report` runs this, and it runs before the build — so `lint` is not in
# it. Not an oversight: `ts/no-deprecated` is type-aware and cannot resolve
# across a package boundary until `dist` exists, so linting here would report a
# tidy pass over the one thing it cannot see (#546). `checks/task-graph` keeps
# this list and the `&&` chain in agreement, and names the gap in its own output
# so a clean report is not read as "lint is clean".
pipelines:
  checks: [test:checks]
minimumReleaseAgeExclude:
  - '@vueuse/core@15.0.0'
  - '@vueuse/metadata@15.0.0'
  - '@vueuse/shared@15.0.0'
