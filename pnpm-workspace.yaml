packages:
  - 'packages/*'
  - 'examples/*'
  - docs
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  puppeteer: true
  svelte-preprocess: true
  unrs-resolver: true
  vue-demi: true
catalog:
  '@vueuse/core': ^14.4.0
  '@tailwindcss/postcss': ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  postcss: ^8.4.49
  tailwindcss: ^4.3.3
  typescript: 5.6.3
  vite: ^8.2.0

peerDependencyRules:
  ignoreMissing:
    - '@algolia/client-search'
    - '@types/react'
    - eslint
    - react
    - react-dom
    - vue
    - webpack
  allowedVersions:
    eslint: '*'
    eslint-plugin-promise: '*'
    eslint-plugin-vue: '*'
    vite: ^8.0.0
    vue: '*'
