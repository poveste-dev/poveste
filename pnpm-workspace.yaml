packages:
  - 'packages/*'
  - 'examples/*'
  - docs
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  puppeteer: true
  svelte-preprocess: true
  unrs-resolver: true
  vue-demi: true
catalog:
  '@vueuse/core': ^12.0.0
  autoprefixer: ^10.4.20
  postcss: ^8.4.49
  tailwindcss: ^3.4.16
  typescript: 5.6.3
  vite: ^7.3.0

peerDependencyRules:
  ignoreMissing:
    - '@algolia/client-search'
    - '@types/react'
    - eslint
    - react
    - react-dom
    - vue
    - webpack
  allowedVersions:
    eslint: '*'
    eslint-plugin-promise: '*'
    eslint-plugin-vue: '*'
    vite: ^7.0.0 || ^8.0.0
    vue: '*'
