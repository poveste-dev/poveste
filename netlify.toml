# VitePress docs deploy for poveste.dev.
#
# poveste.dev serves the PRODUCTION branch, which is `main`. Netlify has no key for
# that — `[context.production]` configures the production context but does not say
# which branch fills it, so it is set in the Netlify UI (Site configuration → Build
# & deploy → Branches) and recorded here because a checkout has no other way to know
# (#321). The practical consequence: a docs-only fix merged to `next` is not on the
# site until a release moves it to `main`.
#
# To confirm which branch and commit built what the site is serving:
#
#   curl -s https://poveste.dev/ | sed -n 's/.*name="poveste:deploy" content="\([^"]*\)".*/\1/p'
#
# That meta tag is emitted from Netlify's own BRANCH/COMMIT_REF/CONTEXT during the
# build (see docs/.vitepress/config.js); it is absent from local builds, and from any
# deploy made before it shipped.
#
# Read the commit as "what last rebuilt the docs", NOT as the tip of the branch. The
# `ignore` rule below skips the build when nothing the site is made of changed, so a
# code-only merge to `main` leaves the previous deploy — and its commit — in place. A
# marker behind the branch tip is the skip working, not a failed deploy. The branch
# and context are always current; only the commit can lag.
#
# A branch name containing `&` or `"` arrives HTML-escaped through the curl form;
# `pnpm run test:docs-site:live` decodes it.
#
# `pnpm run test:docs-site` checks this file against the build; after a deploy,
# `pnpm run test:docs-site:live` checks the same contract against production — pass a
# deploy preview url to check a redirect change before it lands, and it reports the
# branch it reached.
# Netlify detects pnpm from pnpm-lock.yaml and runs `pnpm install` before the
# build command below.
[build]
command = "pnpm docs:build"
publish = "docs/.vitepress/dist"
# Skip the build when nothing the docs site is made of changed. Nothing under
# packages/ can affect it — docs/package.json depends only on vue, and the
# .vitepress theme imports no workspace package — so a code-only PR would
# otherwise reinstall the monorepo to republish an identical site.
# Exit 0 means "skip"; git diff --quiet exits 0 when there is no diff. If
# CACHED_COMMIT_REF is unset (first build of a preview) the command fails and
# the build runs, which is the fallback we want.
ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- docs/ netlify.toml package.json pnpm-lock.yaml"

[build.environment]
# Node 24 LTS — VitePress builds fine on it and it's reliably available on
# Netlify's build image. (The repo/CI run Node 26; the docs don't need it.)
NODE_VERSION = "24"

# The framework URL segments carried histoire-era major versions (`/guide/svelte3/`
# documenting Svelte 5) and were renamed in #120. These are permanent: the old paths have
# years of inbound links behind them and nothing ever retires them.
#
# Order matters — Netlify takes the FIRST matching rule, so nothing broader may be
# added above these.
# `/new` was an unlinked duplicate of the four StackBlitz boxes on
# `guide/getting-started`, deleted in #390. It was serving 200 and sitemapped, so
# it has whatever inbound links an indexed page collects — they go to the page
# that already held the same content.
[[redirects]]
from = "/new"
to = "/guide/getting-started.html"
status = 301

[[redirects]]
from = "/new.html"
to = "/guide/getting-started.html"
status = 301

[[redirects]]
from = "/guide/vue3/*"
to = "/guide/vue/:splat"
status = 301

[[redirects]]
from = "/guide/svelte3/*"
to = "/guide/svelte/:splat"
status = 301

[[redirects]]
from = "/reference/vue3/*"
to = "/reference/vue/:splat"
status = 301

[[redirects]]
from = "/reference/svelte3/*"
to = "/reference/svelte/:splat"
status = 301

[[redirects]]
from = "/examples/vue3/*"
to = "/examples/vue/:splat"
status = 301

# There is deliberately no `/*` catch-all below. Netlify serves `404.html` from the
# publish directory for unmatched paths on its own, with a 404 status. The rule that
# used to sit here was a status-200 rewrite to `/index.html` — the SPA pattern, wrong
# for a static site — so every missing path answered 200 with the home page byte for
# byte, which search engines read as a soft 404 (#343). Real pages never needed it
# either: VitePress builds a file per page, and Netlify resolves extensionless paths
# and directory indexes without a rule.
